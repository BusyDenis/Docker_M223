services:
  frontend:
    container_name: denis_frontend
    build:
      context: ./frontend/223_User_Profile_Frontend
      dockerfile: Dockerfile
    image: docker223-frontend
    restart: unless-stopped
    ports:
      - "8904:80"
    depends_on:
      - backend

  backend:
    container_name: denis_backend
    build:
      context: ./backend/223_User_Profile_Backend
      dockerfile: Dockerfile
    image: docker223-backend
    restart: unless-stopped
    ports:
      - "8905:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: denis_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Only enable if db/init.sql exists as a FILE (not a directory)
    # volumes:
    #   - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
